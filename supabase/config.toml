project_id = "fichaje-h1"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
enable_signup = false
[auth.email]
# Email/password provider enabled; public signup remains disabled by auth.enable_signup.
enable_signup = true
enable_confirmations = true
[analytics]
enabled = false
# H7: both functions validate every JWT against Auth themselves and refuse any request
# not signed by the same-origin edge (x-fichaje-edge) before parsing it, validating a JWT
# or touching SQL; their health probes carry no JWT. Same as PlatformDeployer (--no-verify-jwt).
[functions.kiosk]
verify_jwt = false
[functions.export-link]
verify_jwt = false
