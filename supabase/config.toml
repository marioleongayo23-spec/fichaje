project_id = "fichaje-h1"
[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
shadow_port = 54320
major_version = 17
[db.seed]
enabled = false
[studio]
enabled = false
[local_smtp]
enabled = true
port = 54324
[storage]
enabled = true
file_size_limit = "10MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = []
jwt_expiry = 3600
# Self-service company onboarding: Auth account creation is public, but no tenant
# or role is granted by Auth. A verified identity must pass create_organization RPC.
enable_signup = true
[auth.email]
# Email/password provider enabled; public signup remains disabled by auth.enable_signup.
enable_signup = true
enable_confirmations = true

# HITO 15: Email templates apply in local Supabase CLI. Hosted projects need
# the same HTML in Dashboard > Authentication > Email Templates (see docs).
[auth.email.template.confirmation]
subject = "Bundy · Confirma tu correo"
content_path = "./supabase/templates/confirmation.html"
[auth.email.template.recovery]
subject = "Bundy · Restablece tu contraseña"
content_path = "./supabase/templates/recovery.html"
[auth.email.template.magic_link]
subject = "Bundy · Accede a tu cuenta"
content_path = "./supabase/templates/magic_link.html"
[auth.email.template.email_change]
subject = "Bundy · Confirma tu nuevo correo"
content_path = "./supabase/templates/email_change.html"
[auth.email.template.invite]
subject = "Bundy · Te han invitado"
content_path = "./supabase/templates/invite.html"

# No outbound invitation is delivered until the provider and verified sender
# have been configured in the runtime; never store credentials in this file.
[functions.send-invitation]
verify_jwt = true

[analytics]
enabled = false
# H7: both functions validate every JWT against Auth themselves and refuse any request
# not signed by the same-origin edge (x-fichaje-edge) before parsing it, validating a JWT
# or touching SQL; their health probes carry no JWT. Same as PlatformDeployer (--no-verify-jwt).
[functions.kiosk]
verify_jwt = false
[functions.export-link]
verify_jwt = false

# Stripe user routes authenticate through the signed edge; the direct webhook verifies Stripe-Signature.
[functions.billing]
verify_jwt = false
