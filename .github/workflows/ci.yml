name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: |
          npm ci
          npm ci --prefix edge
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        env:
          FICHAJE_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
          FICHAJE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
          VITE_SUPABASE_URL: https://pvfjffeszsedslmwdvgh.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_jx_GYNBHI21Z8j7_rI18Qg_zE9MgO-R
        run: npm run build
      - name: Secret scan of build output
        run: npm run scan:secrets
      - name: Build self-contained Pages upload
        run: |
          rm -rf pages-upload pages-worker
          cp -R dist pages-upload
          edge/node_modules/.bin/wrangler pages functions build functions \
            --outdir pages-worker \
            --project-directory . \
            --compatibility-date 2026-09-01
          test -s pages-worker/index.js
          cp -R pages-worker/. pages-upload/
          mv pages-upload/index.js pages-upload/_worker.js
          test -s pages-upload/_worker.js
      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: pages-upload/
          if-no-files-found: error
          retention-days: 1
      - name: OPS-02 operational contract unit tests
        run: python3 -m unittest discover -s tests/ops
      - name: Shell syntax and whitespace
        run: |
          bash -n scripts/*.sh
          git diff --check
