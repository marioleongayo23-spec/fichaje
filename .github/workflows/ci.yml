name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm test
      - name: Build
        env:
          FICHAJE_RELEASE: ${{ github.event.pull_request.head.sha || github.sha }}
          FICHAJE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run build
      - name: Secret scan of build output
        run: npm run scan:secrets
      - name: Upload Pages build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist-${{ github.event.pull_request.head.sha || github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 1
      - name: OPS-02 operational contract unit tests
        run: python3 -m unittest discover -s tests/ops
      - name: Shell syntax and whitespace
        run: |
          bash -n scripts/*.sh
          git diff --check
