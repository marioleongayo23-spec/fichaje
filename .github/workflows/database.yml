name: Database H1 + H2 + H3 + H4
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: db-${{ github.ref }}
  cancel-in-progress: true
jobs:
  database:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Gateway dependencies and strict typecheck
        run: |
          python -m pip install cryptography==46.0.3
          deno check --config supabase/functions/kiosk/deno.json supabase/functions/kiosk/index.ts
      - name: Network minimization tests
        run: deno test supabase/functions/kiosk/network_test.ts
      - name: Start isolated local Supabase
        run: supabase start -x realtime,imgproxy,edge-runtime,logflare,vector,supavisor > /dev/null
      - name: Rebuild from empty database
        run: supabase db reset --local --no-seed
      - name: Real SQL and RLS tests
        run: supabase test db
      - name: Real Auth, REST, Storage and concurrency tests
        run: python3 tests/integration/h4.py
      - name: Stop local containers
        if: always()
        run: supabase stop --no-backup
