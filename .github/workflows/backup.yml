name: Repository backup
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 01:30 UTC = 02:30 CET / 03:30 CEST. Drive copy runs later from ChatGPT.
    - cron: '30 1 * * *'
permissions:
  contents: read
concurrency:
  group: repository-backup
  cancel-in-progress: false
jobs:
  repository:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Create and verify repository backup
        env:
          BACKUP_UPLOAD_DRIVE: '0'
        run: |
          set -euo pipefail
          umask 077
          bash scripts/backup_repo.sh "$RUNNER_TEMP/fichaje-backups"
      - name: Retain private repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fichaje-backups/
          retention-days: 14
          if-no-files-found: error
