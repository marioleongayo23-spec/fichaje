name: Repository backup (manual)
on:
  workflow_dispatch:
    inputs:
      upload_drive:
        description: 'Upload repository backup to configured private Drive'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: repository-backup
  cancel-in-progress: false
jobs:
  repository:
    # Secrets only consumed by reviewed code on main. No schedule and no database job.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install rclone only when requested
        if: inputs.upload_drive
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y rclone
      - name: Create and verify repository backup
        env:
          BACKUP_UPLOAD_DRIVE: ${{ inputs.upload_drive && '1' || '0' }}
          RCLONE_CONFIG_CONTENT: ${{ secrets.RCLONE_CONFIG }}
          RCLONE_DESTINATION: ${{ secrets.RCLONE_DESTINATION }}
        run: |
          set -euo pipefail
          umask 077
          if [[ "$BACKUP_UPLOAD_DRIVE" == 1 ]]; then
            test -n "$RCLONE_CONFIG_CONTENT"
            test -n "$RCLONE_DESTINATION"
            export RCLONE_CONFIG="$RUNNER_TEMP/fichaje-rclone.conf"
            trap 'rm -f -- "$RCLONE_CONFIG"' EXIT
            printf '%s' "$RCLONE_CONFIG_CONTENT" > "$RCLONE_CONFIG"
          fi
          unset RCLONE_CONFIG_CONTENT
          bash scripts/backup_repo.sh "$RUNNER_TEMP/fichaje-backups"
      - name: Retain private repository artifacts
        uses: actions/upload-artifact@v4
        with:
          name: repository-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/fichaje-backups/
          retention-days: 14
          if-no-files-found: error
      - name: Cleanup temporary configuration
        if: always()
        run: rm -f -- "$RUNNER_TEMP/fichaje-rclone.conf"
